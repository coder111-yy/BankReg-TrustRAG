[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankreg-trustrag"
version = "0.1.0"
description = "Local, evidence-first RAG for banking regulations and statistical reports"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "python-dotenv>=1.0",
  "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
